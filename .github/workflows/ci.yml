name: CI

# The Android and Windows test suites (see Shared/ARCHITECTURE.markdown) — iOS runs on Xcode Cloud.
# The Windows job matters most: WinUI can't build on the macOS dev machine, so this is the
# only place Prosary.Tests actually executes. The web jobs build the Astro landing site,
# type-check/build both app surfaces, and prove Compose's emitted bundle round-trips through
# the canonical validator (the deployment hosts build again; this guards branches).
# Work happens on feature branches; main only receives finished "major" projects — so CI runs
# on every branch push (no separate pull_request trigger: same-repo PRs would double-run).
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "**.markdown"
  workflow_dispatch:

jobs:
  format:
    name: Bundle format (validator rules + every shipped bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Validate
        run: uv run --script Shared/tools/test-validate-devotion.py
      - name: Prayer line breaks are applied on all three platforms
        run: uv run --script Shared/tools/reflow-prayers.py --check
      - name: Portable packs stay canonical without duplicate native artwork
        run: uv run --script Shared/tools/test-asset-deduplication.py
      - name: Erez's Aramaic converter and generated packs stay in step
        run: uv run --script Shared/tools/test-import-scripture.py
      - name: Sourced feast names stay canonical across every calendar and port
        run: |
          uv run --script Shared/tools/fetch-feasts.py --self-test
          uv run --script Shared/tools/fetch-feasts.py --localize-only --sync
          git diff --exit-code -- Shared/data iOS/Prosary/Data Android/app/src/main/assets/data Windows/Prosary/Data

  android:
    name: Android (unit tests + packaged-asset contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run unit tests and compile the device smoke test
        working-directory: Android
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Prayer packs remain seekable Android assets
        working-directory: Android
        run: |
          expected=$(find app/src/main/assets -maxdepth 1 -name '*.prosaryprayer' | wc -l)
          unzip -lv app/build/outputs/apk/debug/app-debug.apk 'assets/*.prosaryprayer' |
            awk -v expected="$expected" '
              $8 ~ /\.prosaryprayer$/ { count++; if ($2 != "Stored") bad = 1 }
              END {
                if (count != expected || bad) {
                  print "expected every .prosaryprayer asset to be Stored in the APK" > "/dev/stderr"
                  exit 1
                }
              }
            '

  compose:
    name: Compose (build + bundle e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Compose/package-lock.json
      - name: Install dependencies
        working-directory: Compose
        run: npm ci
      - name: Build
        working-directory: Compose
        run: npm run build
      - name: Bundle round-trip + canonical validator
        working-directory: Compose
        run: |
          npm run e2e
          uv run python -c "import zipfile; zipfile.ZipFile('dist-e2e/exampleDevotion.prosaryprayer').extractall('dist-e2e/extracted')"
          uv run --script ../Shared/tools/validate-devotion.py dist-e2e/extracted
          uv run python -c "import zipfile; zipfile.ZipFile('dist-e2e/exampleForms.prosaryprayer').extractall('dist-e2e/extracted-forms')"
          uv run --script ../Shared/tools/validate-devotion.py dist-e2e/extracted-forms
          uv run python -c "import zipfile; zipfile.ZipFile('dist-e2e/novena.prosaryprayer').extractall('dist-e2e/extracted-days')"
          uv run --script ../Shared/tools/validate-devotion.py dist-e2e/extracted-days

  repository:
    name: Repository (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Repository/package-lock.json
      - name: Install dependencies
        working-directory: Repository
        run: npm ci
      - name: ZIP and submission policy tests
        working-directory: Repository
        run: npm test
      - name: Build (type-check included)
        working-directory: Repository
        run: npm run build

  website:
    name: Website (Astro build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Shared/website/package-lock.json
      - name: Install dependencies
        working-directory: Shared/website
        run: npm ci
      - name: Build
        working-directory: Shared/website
        run: npm run build

  windows:
    name: Windows (Prosary.Tests)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run tests
        # The WASDK DeploymentManager auto-initializer is compiled into Prosary.dll's module
        # initializer and throws REGDB_E_CLASSNOTREG in an unpackaged test host; the global
        # property rebuilds the whole graph without it for the test run only.
        run: >
          dotnet test Windows/Prosary.Tests/Prosary.Tests.csproj -c Debug -p:Platform=x64
          -p:WindowsAppSdkDeploymentManagerInitialize=false
          -p:WindowsAppSdkBootstrapInitialize=false
